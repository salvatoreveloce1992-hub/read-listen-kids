<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172d42"><link rel="manifest" href="manifest.webmanifest"><title>Read & Listen Kids</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#173047;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}header{background:#172d42;color:white;padding:20px 16px}header h1{margin:0;font-size:1.55rem}header p{margin:5px 0 0;color:#cce0e9}.wrap{max-width:850px;margin:auto;padding:20px 14px}h2{font-size:1.25rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:white;border-radius:16px;padding:17px;box-shadow:0 3px 15px #1830470c;border:1px solid #e1eaf0}.card.selected{border:2px solid #268e7b}button{cursor:pointer;border:0;border-radius:12px;background:#167e70;color:white;padding:12px 16px;font-size:1rem;font-weight:650}button.secondary{background:#e6f2f0;color:#175d56}button:disabled{opacity:.45;cursor:not-allowed}.profile{width:100%;text-align:left;background:white;color:#173047;border:2px solid #e0e9ed}.profile.active{border-color:#167e70;background:#ebf7f4}.muted{color:#607586;font-size:.91rem}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.story{font-size:1.18rem;line-height:1.9;white-space:pre-line}.answer{display:block;width:100%;text-align:left;margin:9px 0;background:#eef4f8;color:#173047}.answer.picked{background:#c6eee4;outline:2px solid #167e70}.tag{font-size:.8rem;background:#e8f3f6;border-radius:20px;padding:5px 9px}progress{width:100%;height:16px;accent-color:#167e70}.hide{display:none}footer{text-align:center;color:#637787;padding:20px;font-size:.85rem}.notice{padding:12px;border-radius:12px;background:#fff5d8;color:#70531c;margin:10px 0}@media(max-width:480px){.wrap{padding:14px 10px}.card{padding:14px}}
</style></head><body><header><div style="max-width:850px;margin:auto"><h1>📚 Read & Listen Kids</h1><p>Read • Listen • Understand • Grow</p></div></header><main class="wrap"><section class="card"><h2>Who's learning today?</h2><div id="profiles" class="grid"></div></section><section id="home" style="margin-top:18px"><h2>Choose a story</h2><p class="muted">Select Reading or Listening. Complete the questions to earn stars.</p><div id="stories" class="grid"></div></section><section id="activity" class="card hide" style="margin-top:18px"></section><section class="card" style="margin-top:18px"><h2>📈 My Progress</h2><div id="progress"></div><div class="row" style="margin-top:14px"><button class="secondary" id="export">Export progress</button><button class="secondary" id="reset">Reset selected child's progress</button></div></section></main><footer>Original stories • UK English • Progress saved on this device • No account required</footer><script>
const profiles=[{id:'adriel',name:'Adriel',age:11,icon:'🧑🏽'},{id:'noah',name:'Noah',age:8,icon:'👦🏽'},{id:'priscilla',name:'Priscilla',age:4,icon:'👧🏽'}];
const stories=[
{id:'cat',title:'The Lost Kitten',age:'4–6',level:1,emoji:'🐱',text:'Mia sees a little kitten in the garden. The kitten is wet and cold. Mia brings a soft towel and a bowl of water. She asks her dad for help. They find the kitten’s owner next door. The owner says, “Thank you, Mia!”',questions:[['Where does Mia find the kitten?',['In the garden','At school','On a bus'],0],['How does the kitten feel?',['Hot and happy','Wet and cold','Hungry and angry'],1],['Who helps Mia?',['Her dad','Her teacher','Her friend'],0],['Where does the owner live?',['Next door','In another city','At the zoo'],0]]},
{id:'seed',title:'The Magic Seed',age:'4–8',level:1,emoji:'🌱',text:'Ben plants a tiny seed in a pot. Every morning, he gives it water. He puts the pot near a sunny window. After seven days, a green shoot appears. Ben smiles. He knows that plants need water and sunlight to grow.',questions:[['What does Ben plant?',['A tree','A seed','A flower'],1],['Where does he put the pot?',['Near a sunny window','Under his bed','In the cupboard'],0],['When does the shoot appear?',['After one day','After seven days','After a month'],1],['What do plants need?',['Water and sunlight','Only darkness','Chocolate'],0]]},
{id:'library',title:'The Library Mystery',age:'7–10',level:2,emoji:'🔎',text:'On Tuesday afternoon, Oliver visits the school library. He discovers a small blue notebook behind a shelf. Inside, he finds clues about a missing book. The first clue points to the history section. There, Oliver notices an empty space between two large books. He tells the librarian, Mrs Patel, who checks the borrowing records. The missing book was returned that morning but put on the wrong shelf. Together, they find it in the science section. Oliver learns that careful observation can solve a mystery.',questions:[['When does Oliver visit the library?',['Monday morning','Tuesday afternoon','Friday evening'],1],['What colour is the notebook?',['Blue','Green','Red'],0],['Who checks the borrowing records?',['Oliver’s brother','Mrs Patel','The headteacher'],1],['Where is the missing book found?',['Science section','History section','Playground'],0]]},
{id:'river',title:'The River Project',age:'8–12',level:3,emoji:'🌊',text:'A group of pupils decided to investigate the health of a river near their town. Over three weeks, they recorded litter, water clarity and the number of birds they observed. Their first visit revealed plastic bottles and food wrappers along the bank. Rather than simply complain, the pupils organised a supervised clean-up with local volunteers. On their final visit, they noticed less litter, although the water was still cloudy after heavy rain. Their teacher explained that one clean-up cannot solve every environmental problem. The class presented its findings to the local council and suggested more bins and regular community events.',questions:[['How long did the investigation last?',['Three days','Three weeks','Three months'],1],['What did the pupils record?',['Litter, water clarity and birds','Only the temperature','Fish prices'],0],['Why was the water still cloudy?',['Heavy rain','Paint in the water','Too many birds'],0],['What is the main message?',['A single action fixes everything','Community action and ongoing effort both matter','Rivers never change'],1]]},
{id:'robot',title:'The Robot Debate',age:'10–13',level:3,emoji:'🤖',text:'At a school debate, Aisha argued that robots could make everyday life safer by carrying out dangerous tasks. She mentioned machines used to inspect damaged buildings after earthquakes. Daniel agreed that technology offered benefits, but warned that people might rely on it without questioning mistakes. He suggested that schools should teach pupils how automated systems make decisions. The debate ended without a clear winner. Instead, the class concluded that useful technology requires human judgement, careful testing and responsibility. Aisha realised that listening to an opposing argument could strengthen her own ideas.',questions:[['What example does Aisha give?',['Inspecting damaged buildings','Cooking school dinners','Writing novels'],0],['What worries Daniel?',['Robots are too colourful','People may trust technology without checking mistakes','Schools have no computers'],1],['What did the class conclude?',['All robots should be banned','Technology needs human judgement and testing','Robots never make mistakes'],1],['What did Aisha learn?',['Opposing arguments can improve her thinking','Debates must have a winner','Listening is unnecessary'],0]]}
];
const key='read-listen-kids-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let current='adriel',active=null,mode='reading',answers={};const $=id=>document.getElementById(id);const store=()=>{try{localStorage.setItem(key,JSON.stringify(saved))}catch{alert('Storage is unavailable in this browser. Progress may not be saved.')}};
function renderProfiles(){$('profiles').innerHTML=profiles.map(p=>`<button class="profile ${p.id===current?'active':''}" data-profile="${p.id}"><span style="font-size:2rem">${p.icon}</span><br><b>${p.name}</b><br><small>${p.age} years</small></button>`).join('');document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{speechSynthesis.cancel();current=b.dataset.profile;active=null;$('activity').classList.add('hide');render()})}
function renderStories(){let age=profiles.find(p=>p.id===current).age;let available=stories.filter(s=>age>=parseInt(s.age)&&age<=parseInt(s.age.split('–')[1]));$('stories').innerHTML=available.map(s=>`<div class="card"><div style="font-size:2rem">${s.emoji}</div><h3>${s.title}</h3><span class="tag">Ages ${s.age}</span><div class="row" style="margin-top:15px"><button data-start="${s.id}" data-mode="reading">📖 Read</button><button class="secondary" data-start="${s.id}" data-mode="listening">🎧 Listen</button></div></div>`).join('');document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start,b.dataset.mode))}
function start(id,m){speechSynthesis.cancel();active=stories.find(s=>s.id===id);mode=m;answers={};$('activity').classList.remove('hide');let a=$('activity');a.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${active.emoji} ${active.title}</h2><span class="tag">${mode==='reading'?'Reading':'Listening'}</span></div><div id="storyArea"></div><div id="quiz"></div><div id="result"></div><button class="secondary" id="close">← Back to stories</button>`;$('close').onclick=()=>{speechSynthesis.cancel();a.classList.add('hide');active=null};if(mode==='reading'){$('storyArea').innerHTML=`<p class="story"></p>`;$('storyArea').querySelector('p').textContent=active.text}else{$('storyArea').innerHTML='<p class="muted">Listen to the story. You can replay it before answering.</p><div class="row"><button id="play">▶ Play story</button><button id="stop" class="secondary">■ Stop</button></div><p class="muted" id="voiceInfo">Uses the voice available on your device.</p>';$('play').onclick=speak;$('stop').onclick=()=>speechSynthesis.cancel();speak()}renderQuiz();a.scrollIntoView({behavior:'smooth'})}
function speak(){if(!('speechSynthesis' in window)){alert('Speech playback is not supported by this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(active.text);u.lang='en-GB';u.rate=profiles.find(p=>p.id===current).age<=6?.82:.92;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='en-gb')||voices.find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u)}
function renderQuiz(){let q=$('quiz');q.innerHTML='<h3>Comprehension questions</h3>'+active.questions.map((item,i)=>`<div style="margin:17px 0"><b>${i+1}. ${item[0]}</b>${item[1].map((option,j)=>`<button class="answer ${answers[i]===j?'picked':''}" data-q="${i}" data-a="${j}">${String.fromCharCode(65+j)}. ${option}</button>`).join('')}</div>`).join('')+'<button id="submit" disabled>Check my answers</button>';q.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{answers[+b.dataset.q]=+b.dataset.a;renderQuiz()});$('submit').disabled=Object.keys(answers).length!==active.questions.length;$('submit').onclick=submit}
function submit(){let score=active.questions.reduce((n,q,i)=>n+(answers[i]===q[2]?1:0),0),total=active.questions.length;let entry={story:active.id,title:active.title,mode,score,total,date:new Date().toISOString()};saved[current]??=[];saved[current].push(entry);store();$('quiz').innerHTML='';$('storyArea').innerHTML='';$('result').innerHTML=`<h2>⭐ ${score} / ${total} correct!</h2><p>${score===total?'Excellent work!':score>=total/2?'Good effort! Keep practising.':'Keep trying! You can learn from every story.'}</p><h3>Review your answers</h3>`+active.questions.map((q,i)=>`<p><b>${q[0]}</b><br>Your answer: ${q[1][answers[i]]} ${answers[i]===q[2]?'✅':'❌'}<br>${answers[i]!==q[2]?'Correct answer: '+q[1][q[2]]:''}</p>`).join('')+'<button id="retry">Try again</button>';$('retry').onclick=()=>start(active.id,mode);renderProgress()}
function renderProgress(){let data=saved[current]||[];if(!data.length){$('progress').innerHTML='<p class="muted">No completed activities yet. Finish a quiz to see your progress.</p>';return}let avg=Math.round(data.reduce((n,x)=>n+100*x.score/x.total,0)/data.length),unique=new Set(data.map(x=>x.story)).size;$('progress').innerHTML=`<div class="row"><span class="tag">${data.length} quizzes completed</span><span class="tag">${unique} stories explored</span><span class="tag">${avg}% average score</span></div><p>Average score</p><progress value="${avg}" max="100"></progress><h3>Recent activities</h3>`+data.slice(-8).reverse().map(x=>`<p class="muted">${new Date(x.date).toLocaleDateString('en-GB')} · ${x.mode==='reading'?'📖':'🎧'} ${x.title} — ${x.score}/${x.total}</p>`).join('')}
function render(){renderProfiles();renderStories();renderProgress()};$('reset').onclick=()=>{if(confirm('Delete all progress for '+profiles.find(p=>p.id===current).name+' on this device?')){delete saved[current];store();renderProgress()}};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({exported:new Date().toISOString(),profiles,progress:saved},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='read-listen-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></body></html>
